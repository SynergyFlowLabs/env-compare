<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />

    <title>EnvCompare — see what your .env is missing</title>
    <meta
      name="description"
      content="Paste .env and .env.example — or six more — and see every variable that is missing, empty, a placeholder, or leftover. Free, open source, nothing uploaded."
    />
    <link rel="canonical" href="https://envcompare.vercel.app/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="EnvCompare contributors" />
    <meta name="application-name" content="EnvCompare" />
    <meta name="color-scheme" content="light dark" />

    <!-- Google Search only reads .ico/.png favicons; SVG is a bonus for browsers. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#101215" />

    <!-- Open Graph: read by Slack, Discord, LinkedIn, iMessage, Facebook. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EnvCompare" />
    <meta property="og:url" content="https://envcompare.vercel.app/" />
    <meta property="og:title" content="EnvCompare — see what your .env is missing" />
    <meta
      property="og:description"
      content="Compare two to eight env files in your browser. See every variable that is missing, empty, or leftover — then copy the block to fix it. Nothing is uploaded."
    />
    <meta property="og:image" content="https://envcompare.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="EnvCompare: a dark card reading “See what your .env is missing”, beside a table of env keys marked Match, Missing, Same, Different and Extra."
    />
    <meta property="og:locale" content="en_US" />

    <!-- X / Twitter. summary_large_image keeps the full card on mobile. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EnvCompare — see what your .env is missing" />
    <meta
      name="twitter:description"
      content="Compare two to eight env files in your browser. See every variable that is missing, empty, or leftover — then copy the block to fix it. Nothing is uploaded."
    />
    <meta name="twitter:image" content="https://envcompare.vercel.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="EnvCompare: a dark card reading “See what your .env is missing”, beside a table of env keys marked Match, Missing, Same, Different and Extra."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "EnvCompare",
        "url": "https://envcompare.vercel.app/",
        "description": "Compare two to eight .env files in the browser and see every variable that is missing, empty, placeholder or leftover. Nothing is uploaded or stored.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://opensource.org/license/mit",
        "codeRepository": "https://github.com/SynergyFlowLabs/env-compare",
        "image": "https://envcompare.vercel.app/og-image.png",
        "featureList": [
          "Compare two to eight env files at once",
          "Detect missing, empty, placeholder, commented and differing variables",
          "Copy a fix block for any target file",
          "Redacted Markdown report and agent prompt",
          "No upload, no storage, no analytics"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!--
        Rendered before the app boots, and cleared by React on mount. Crawlers and
        link-preview bots do not run JavaScript, so without this the page has no
        heading at all — the one thing a search result needs.
      -->
      <h1
        style="
          position: absolute;
          width: 1px;
          height: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
          border: 0;
        "
      >
        EnvCompare — see what your .env is missing
      </h1>
      <noscript>
        <div style="max-width: 44rem; margin: 4rem auto; font: 16px/1.6 system-ui, sans-serif; color: #15181c; padding: 0 1.5rem">
          <h2>EnvCompare needs JavaScript</h2>
          <p>
            This tool compares your env files inside your own browser, which is why nothing is ever
            uploaded. That means it has to run in the page — there is no server that could do it for
            you. Turn JavaScript on for this site and reload; nothing is installed and nothing is
            stored.
          </p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

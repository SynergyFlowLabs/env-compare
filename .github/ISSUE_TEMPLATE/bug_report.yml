name: Bug report
description: Something is broken that is not about how a file is parsed.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and version
      placeholder: Firefox 131 on macOS
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have not included any real credentials, in text or screenshots.
          required: true

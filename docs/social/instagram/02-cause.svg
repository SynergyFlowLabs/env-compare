  <text x="96" y="494.1" fill="#f6f6f3"
        font-family="DejaVu Sans, Verdana, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="-2.4">touch your .env.</text>
      <text x="96" y="600" fill="#a7aebb" font-family="DejaVu Sans, Verdana, Helvetica, Arial, sans-serif" font-size="33"

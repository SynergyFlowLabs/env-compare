<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="EnvCompare — see what your .env is missing">
  <title>EnvCompare — see what your .env is missing</title>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.18" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#2c46c8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2c46c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.55" stop-color="#101215" stop-opacity="0"/>
      <stop offset="1" stop-color="#101215" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="#101215"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- Mark: the same tile as favicon.svg, scaled up. -->
  <g transform="translate(72 52)">
    <rect width="56" height="56" rx="13" fill="#15181c" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="13" y="14" width="9" height="28" rx="2.5" fill="#f6f6f3"/>
    <rect x="34" y="14" width="9" height="11" rx="2.5" fill="#f6f6f3" fill-opacity="0.55"/>
    <rect x="34" y="31" width="9" height="11" rx="2.5" fill="#f6f6f3" fill-opacity="0.55"/>
  </g>
  <text x="148" y="88" fill="#f6f6f3" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="26" font-weight="700" letter-spacing="-0.4">EnvCompare</text>

  <text x="72" y="196" fill="#ffffff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="42" font-weight="700" letter-spacing="-1.2">See what your <tspan font-family="DejaVu Sans Mono,Consolas,monospace" font-size="39">.env</tspan> is missing.</text>
  <text x="72" y="238" fill="#a7aebb" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="18">Compare 2–8 env files in your browser. Nothing is uploaded, nothing is stored.</text>

  <g transform="translate(72 264)">
    <circle cx="5" cy="7" r="4" fill="#2f6b4f"/>
    <text x="18" y="12" fill="#78808e" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="13">envcompare.vercel.app</text>
  </g>

  <!-- A miniature of the table: keys on the left, state chips on the right. -->
  <g transform="translate(828 44)">
    <rect width="392" height="250" rx="12" fill="#171a1f" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="20" y="30" fill="#78808e" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">.env.example → .env</text>

    <g font-family="DejaVu Sans Mono,Consolas,monospace" font-size="12.5">
      <g transform="translate(20 46)">
        <rect width="352" height="1" fill="#ffffff" fill-opacity="0.06"/>
        <text x="0" y="22" fill="#cfd6e2">DATABASE_URL</text>
        <rect x="252" y="9" width="100" height="20" rx="6" fill="#2f6b4f" fill-opacity="0.18" stroke="#2f6b4f" stroke-opacity="0.45"/>
        <text x="302" y="23" fill="#7fc39f" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Match</text>
      </g>
      <g transform="translate(20 86)">
        <rect width="352" height="1" fill="#ffffff" fill-opacity="0.06"/>
        <text x="0" y="22" fill="#cfd6e2">OPENAI_API_KEY</text>
        <rect x="252" y="9" width="100" height="20" rx="6" fill="#c0392f" fill-opacity="0.18" stroke="#c0392f" stroke-opacity="0.5"/>
        <text x="302" y="23" fill="#e88c84" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Missing</text>
      </g>
      <g transform="translate(20 126)">
        <rect width="352" height="1" fill="#ffffff" fill-opacity="0.06"/>
        <text x="0" y="22" fill="#cfd6e2">STRIPE_SECRET</text>
        <rect x="252" y="9" width="100" height="20" rx="6" fill="#6b4fa1" fill-opacity="0.20" stroke="#6b4fa1" stroke-opacity="0.5"/>
        <text x="302" y="23" fill="#b4a0dd" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Placeholder</text>
      </g>
      <g transform="translate(20 166)">
        <rect width="352" height="1" fill="#ffffff" fill-opacity="0.06"/>
        <text x="0" y="22" fill="#cfd6e2">REDIS_URL</text>
        <rect x="252" y="9" width="100" height="20" rx="6" fill="#1f6f8b" fill-opacity="0.20" stroke="#1f6f8b" stroke-opacity="0.5"/>
        <text x="302" y="23" fill="#7fc0d3" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Different</text>
      </g>
      <g transform="translate(20 206)">
        <rect width="352" height="1" fill="#ffffff" fill-opacity="0.06"/>
        <text x="0" y="22" fill="#cfd6e2">FEATURE_FLAG</text>
        <rect x="252" y="9" width="100" height="20" rx="6" fill="#9a5b00" fill-opacity="0.20" stroke="#9a5b00" stroke-opacity="0.55"/>
        <text x="302" y="23" fill="#dda85a" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Extra</text>
      </g>
    </g>
    <rect x="0" y="0" width="392" height="250" fill="url(#fade)" opacity="0"/>
  </g>
</svg>
